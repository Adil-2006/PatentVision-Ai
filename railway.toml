[build]
# Railway builds using the Dockerfile at the repo root
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c \"(alembic upgrade head || echo 'WARNING: Alembic migration failed, continuing...') && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}\""
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
